name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest]  # TODO: 안정화 후 macos-latest, ubuntu-latest 추가
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # TODO: pyinstaller --onedir --add-data "frontend;frontend" main.py  (Windows는 세미콜론 구분자)
      # TODO: softprops/action-gh-release@v2 로 dist/* 업로드
