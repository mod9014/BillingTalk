name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write 

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - build_mode: onefile
            pyinstaller_flag: --onefile
            upload_path: dist/BillingTalk.exe
          - build_mode: onedir
            pyinstaller_flag: --onedir
            upload_path: dist/BillingTalk-dir.zip
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller # requirements.txt에 pyinstaller가 없다면 명시

      - name: Build (${{ matrix.build_mode }})
        run: |
          pyinstaller -y ${{ matrix.pyinstaller_flag }} --windowed `
            --name BillingTalk `
            --icon icon.ico `
            --add-data "frontend;frontend" `
            --add-data "icon.png;." `
            --collect-all uvicorn `
            --hidden-import multipart `
            main.py

      - name: Package onedir as ZIP
        if: matrix.build_mode == 'onedir'
        run: Compress-Archive -Path dist\BillingTalk\* -DestinationPath dist\BillingTalk-dir.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.upload_path }}
          generate_release_notes: true